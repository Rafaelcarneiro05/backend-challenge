pre-commit:
  parallel: false
  commands:
    format:
      glob: '{src,test}/**/*.ts'
      run: bun run format:check
    lint:
      glob: '{src,test}/**/*.ts'
      run: bun run lint
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
